
name: Build Robo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RoboAndroid_Full_Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: |
          unzip -o RoboAndroid_Full_Source.zip -d .
          test -f RoboAndroid/settings.gradle.kts
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle -p RoboAndroid assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: RoboAndroid-debug-APK
          path: RoboAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
